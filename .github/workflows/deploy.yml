name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A repo named <user>.github.io is served from the root; any other repo
      # is served from /<repo>/, so the path prefix is derived from the name.
      - name: Work out the site URL and path prefix
        run: |
          REPO="${{ github.event.repository.name }}"
          OWNER="${{ github.repository_owner }}"
          echo "SITE_URL=https://${OWNER,,}.github.io" >> "$GITHUB_ENV"
          if [[ "$REPO" == *.github.io ]]; then echo "PATH_PREFIX=/" >> "$GITHUB_ENV";
          else echo "PATH_PREFIX=/$REPO/" >> "$GITHUB_ENV"; fi
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
